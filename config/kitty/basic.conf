## Fonts
font_family       Maple Mono
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         12
# 行高/列宽(调整字体间的间距大小)
modify_font cell_height 0
modify_font cell_width 0
# mono样式字体把unicode字符严格限制在了能显示的字符格内部,
# 这使得原本按正方格子设计的图标字符就显得小了许多,
# 又因后面版本的kiity不能设置非mono字体,
# 所以把所以字体图标映射到 Symbols Nerd Font Mono 字体,
# 保证每个字体图标后有一个额外的空格
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6AA,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF,U+F0001-U+F1AF0 Symbols Nerd Font Mono
# symbol_map U+4E00-U+9FFF,U+3400-U+4DBF Maple Mono NF CN # 将汉字映射到maple字体

## Cursor
cursor_blink_interval      2.0
cursor_stop_blinking_after 5.0
cursor_trail 3
cursor_trail_decay 0.15 0.25
cursor_trail_start_threshold 1

## Scrollback
# scrollback_lines -1
scrollback_lines 200000

## Color scheme
# background_opacity 0.90 # 透明度
dynamic_background_opacity yes

## Mouse
mouse_hide_wait 2.0
copy_on_select  yes

## Terminal bell
enable_audio_bell     no
visual_bell_duration  0.3
bell_on_tab           yes

## Window layout
# hide_window_decorations             titlebar-only
remember_window_size                yes
remember_window_position            yes
enabled_layouts                     grid,tall

## Tab bar
tab_bar_edge              top
tab_bar_style             powerline
tab_powerline_style       round
tab_title_template        "{fmt.fg.gray}{index}{fmt.fg.default}:{title}"
active_tab_title_template "{index}:{title}"

## Advanced
shell                               zsh
editor                              nvim
allow_remote_control                no
allow_hyperlinks                    yes
strip_trailing_spaces               smart
update_check_interval               7

## OS specific tweak
macos_option_as_alt                 yes
macos_quit_when_last_window_closed  yes
