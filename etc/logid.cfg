# 重启logid服务必须保存退出logid.cfg
devices: (
{
    name: "M585/M590 Multi-Device Mouse";
    dpi: 1000;  # 默认DPI，可改为 800/1200/1600
    # 智能滚轮 SmartShift（自动切换阻尼/无阻尼）
    # smartshift: {
    #     on: true;
    #     threshold: 30;  # 数值越小越容易进入无阻尼 1-255
    #     torque: 50;
    # };
    # 高精度滚动
    hiresscroll: {
        hires: true; # 鼠标滚轮是否应为高分辨率
        invert: false; # 反转鼠标滚轮
        target: false; # 要重新映射滚轮操作，此选项必须设置为 true。
    };
    buttons: (
        # https://github.com/PixlOne/logiops/wiki/CIDs
        {
            cid: 0x52; # 中键
            action =
            {
                type: "Gestures";
                gestures: (
                    {
                        direction: "Up";
                        mode: "OnRelease";
                        action =
                        {
                            type: "Keypress";
                            keys: ["KEY_LEFTMETA", "KEY_W"];
                        };
                    },
                    {
                        direction: "Down";
                        mode: "OnRelease";
                        action =
                        {
                            type: "Keypress";
                            keys: ["KEY_LEFTMETA", "KEY_D"];
                        };
                    },
                    {
                        direction: "Left";
                        mode: "OnRelease";
                        action =
                        {
                            type: "Keypress";
                            # keys: ["KEY_LEFTMETA", "KEY_2"]; # 切换浏览器显示
                            keys: ["KEY_LEFTMETA", "KEY_LEFTSHIFT", "KEY_LEFT"];
                        };
                    },
                    {
                        direction: "Right";
                        mode: "OnRelease";
                        action =
                        {
                            type = "Keypress";
                            # keys: ["KEY_LEFTALT", "KEY_LEFTCTRL", "KEY_T"]; #打开Terminal
                            keys: ["KEY_LEFTMETA", "KEY_LEFTSHIFT", "KEY_RIGHT"];
                        }
                    },
                    {
                        direction: "None";
                        mode: "OnRelease";
                        action =
                        {
                            type:"Keypress";
                            keys:["KEY_LEFTMETA", "KEY_W"];
                        }
                    }
                );
            };

        },
        {
            cid: 0x53; # 左侧后退键
            action = {
                type: "Keypress";
                keys: ["KEY_LEFTALT", "KEY_LEFT"];
            };
        },
        {
            cid: 0x56; # 右侧前进键
            action = {
                type: "Keypress";
                keys: ["KEY_LEFTALT", "KEY_RIGHT"];
            };
        }
    );
},
{
    name: "MX Master 3S";
    dpi: 1000;
    smartshift: {
        on: true;
        threshold: 10;  # 滚轮切换阻尼阈值 数值越小越容易进入无阻尼 1-255
        torque: 20;     # 滚轮阻尼强度
    };
    # 高精度滚动（适配Master 3S硬件）
    hiresscroll: {
        hires: true;    # 启用高分辨率滚动
        invert: false;  # 不反转滚轮方向
        target: false;  # 无需重映射滚轮操作
    };
    buttons: (
        {
            cid: 0xc3;  # MX Master 3S 手势的CID
            action =
            {
                type: "Gestures";
                gestures: (
                    {
                        direction: "Up";
                        mode: "OnRelease";
                        action =
                        {
                            type: "Keypress";
                            keys: ["KEY_LEFTMETA", "KEY_W"];  # 上滑：Win+W
                        };
                    },
                    {
                        direction: "Down";
                        mode: "OnRelease";
                        action =
                        {
                            type: "Keypress";
                            keys: ["KEY_LEFTMETA", "KEY_D"];  # 下滑：Win+D
                        };
                    },
                    {
                        direction: "Left";
                        mode: "OnRelease";
                        action =
                        {
                            type: "Keypress";
                            keys: ["KEY_LEFTMETA", "KEY_LEFTSHIFT", "KEY_LEFT"];  # 左滑：Win+Shift+左
                        };
                    },
                    {
                        direction: "Right";
                        mode: "OnRelease";
                        action =
                        {
                            type = "Keypress";
                            keys: ["KEY_LEFTMETA", "KEY_LEFTSHIFT", "KEY_RIGHT"];  # 右滑：Win+Shift+右
                        }
                    },
                    {
                        direction: "None";
                        mode: "OnRelease";
                        action =
                        {
                            type:"Keypress";
                            keys:["KEY_LEFTMETA", "KEY_W"];  # 仅点击：Win+W
                        }
                    }
                );
            };
        },
        {
            cid: 0x52;  # Master 3S 中键CID
            action = {
                type: "Keypress";
                keys: ["KEY_LEFTMETA", "KEY_W"];  # 上滑：Win+W
            };
        },
        # {
        #     cid: 0xc4;  # Master 3S 滚轮模式切换键（SmartShift）CID
        #     action = {
        #         type: "Keypress";
        #         keys: ["KEY_LEFTMETA", "KEY_W"];  # 上滑：Win+W
        #     };
        # },
        {
            cid: 0xc4;  # Master 3S 左侧后退键CID
            action = {
                type: "Keypress";
                keys: ["KEY_LEFTALT", "KEY_LEFT"];  # 后退键：ALT+左方向键
            };
        },
        {
            cid: 0xc5;  # Master 3S 右侧前进键CID
            action = {
                type: "Keypress";
                keys: ["KEY_LEFTALT", "KEY_RIGHT"];  # 前进键：ALT+右方向键
            };
        }
    );
},
);
